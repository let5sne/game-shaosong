<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>版籍 · 行台北伐 | The Register</title>
  <meta name="description" content="原创架空战略游戏：三年期限内收复版籍。以 three.js 铺开二十四州郡的宣纸舆图，同一局号可覆核整局因果。" />
  <!-- OG / Twitter 卡固定英文，供海外抓取；中文标题由 main.js 按 ?lang 覆盖 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Register · A Paper Campaign" />
  <meta property="og:description" content="A deterministic turn-based strategy game about the weight of decisions: limited decrees, fragile supply lines, and one seed that replays every consequence." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="The Register · A Paper Campaign" />
  <meta name="twitter:description" content="Recover the register within a three-year mandate. No twitch, no hidden dice — every consequence is reproducible from one seed." />
  <!-- 印章用中英通用的字母 R（The Register），不再依赖字体子集里的汉字 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23a8392f'/%3E%3Ctext x='32' y='47' font-size='42' font-family='Georgia,serif' text-anchor='middle' fill='%23f7eed9'%3ER%3C/text%3E%3C/svg%3E" />
  <!-- 子集宋体：只预载正文用的 400 字重，避免首屏标题不跳字形。
       700 字重只服务少量加粗文字，preload 会强行与 three / CSS / GLB 抢带宽；
       改由 @font-face 的 font-display:swap 按需发起，少 275 KB 的关键路径竞争。 -->
  <link rel="preload" href="/fonts/register-serif-400.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="app">
    <div id="scene"></div>
    <div id="ui"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
